<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue — AIxercice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalogue">

<div id="site-header"></div>

<header class="page-head">
  <div class="container">
    <h1>Catalogue d'exercices</h1>
    <p class="muted">Filtre par compétence, type ou difficulté pour trouver exactement ce qu'il te faut.</p>
  </div>
</header>

<div class="container catalogue-layout">
  <aside class="facets">
    <div class="facet-group">
      <h3>Compétences</h3>
      <div id="facet-themes"></div>
    </div>
    <div class="facet-group">
      <h3>Type d'exercice</h3>
      <div class="chip-group" id="facet-types"></div>
    </div>
    <div class="facet-group">
      <h3>Difficulté</h3>
      <div class="chip-group" id="facet-difficulty"></div>
    </div>
  </aside>

  <main>
    <div class="active-filters" id="active-filters"></div>
    <div class="results-head">
      <span id="results-count"></span>
      <button class="btn btn-ghost btn-sm" id="reset-filters" style="display:none">Réinitialiser</button>
    </div>
    <div class="results-grid" id="results-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <h3>Aucun exercice ne correspond</h3>
      <p>Essaie d'élargir tes filtres, ou vérifie l'orthographe de ta recherche.</p>
    </div>
  </main>
</div>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/cards.js"></script>
<script src="js/nav.js"></script>
<script src="js/page-catalogue.js"></script>
</body>
</html>
